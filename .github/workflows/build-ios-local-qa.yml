name: Build Zodiac Daily Local QA IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project ZodiacDaily.xcodeproj \
            -scheme ZodiacDaily

      - name: Run core tests
        run: swift test

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ZodiacDaily.xcodeproj \
            -scheme ZodiacDaily \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Validate app bundle
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/ios -path '*Release-iphoneos/ZodiacDaily.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ZodiacDaily.app or Info.plist was not produced"
            exit 1
          fi

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          MINIMUM_IOS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")"
          API_BASE_URL="$(/usr/libexec/PlistBuddy -c 'Print :ZodiacDailyAPIBaseURL' "$APP_PATH/Info.plist")"
          APP_STORE_ID="$(/usr/libexec/PlistBuddy -c 'Print :ZodiacDailyAppStoreID' "$APP_PATH/Info.plist")"

          require_value() {
            if [ "$1" != "$2" ]; then
              echo "Unexpected $3: expected '$2', found '$1'"
              exit 1
            fi
          }

          require_file() {
            if [ ! -f "$1" ]; then
              echo "Missing required app resource: $1"
              exit 1
            fi
          }

          echo "Validating ${BUNDLE_ID} v${VERSION} (${BUILD}), minimum iOS ${MINIMUM_IOS}"
          require_value "$BUNDLE_ID" "com.krazel.zodiacdaily" "bundle identifier"
          require_value "$VERSION" "1.1" "marketing version"
          require_value "$BUILD" "1" "build number"
          require_value "$MINIMUM_IOS" "16.0" "minimum iOS version"
          require_value "$API_BASE_URL" "https://zodiac-daily-content.krazel-zodiac-daily.workers.dev" "API base URL"
          require_value "$APP_STORE_ID" "6800136195" "App Store ID"
          require_file "$APP_PATH/ZodiacDaily"
          require_file "$APP_PATH/PrivacyInfo.xcprivacy"
          require_file "$APP_PATH/Assets.car"
          if ! /usr/bin/strings -a "$APP_PATH/ZodiacDaily" | grep -F "zodiac-daily-content.krazel-zodiac-daily.workers.dev" >/dev/null; then
            echo "Production endpoint fallback is missing from the executable"
            exit 1
          fi
          CONTENT_PATH="$(find "$APP_PATH" -name 'zodiac_daily_content.json' -type f -print -quit)"
          if [ -z "$CONTENT_PATH" ]; then
            echo "Missing bundled zodiac_daily_content.json"
            exit 1
          fi

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Package unsigned Local QA IPA
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
          APP_VERSION: ${{ steps.app.outputs.version }}
          APP_BUILD: ${{ steps.app.outputs.build }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p unsigned-ipa/Payload output
          cp -R "$APP_PATH" unsigned-ipa/Payload/ZodiacDaily.app

          SHORT_SHA="${COMMIT_SHA:0:7}"
          VERSIONED_IPA="ZodiacDaily-v${APP_VERSION}-build-${APP_BUILD}-${SHORT_SHA}-Local-QA-unsigned.ipa"
          (cd unsigned-ipa && zip -qry "../output/${VERSIONED_IPA}" Payload)
          shasum -a 256 "output/${VERSIONED_IPA}" > "output/${VERSIONED_IPA}.sha256"
          printf '%s\n' \
            "app=Zodiac Daily" \
            "marketing_version=${APP_VERSION}" \
            "build=${APP_BUILD}" \
            "commit_sha=${COMMIT_SHA}" \
            "purpose=Local-QA" \
            "github_run_number=${RUN_NUMBER}" \
            "ipa=${VERSIONED_IPA}" \
            > output/ZodiacDaily-Local-QA-manifest.txt
          ls -lh output/*

      - name: Upload Local QA artifact
        uses: actions/upload-artifact@v6
        with:
          name: ZodiacDaily-v1.1-build-1-${{ github.sha }}-Local-QA-run-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 7
